name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # weekly: new vulnerabilities appear without code changes
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # The module floor is Go 1.26, which is also the oldest release Go still
  # supports, so the matrix is exactly the supported set: floor and current.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27', '1.26']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # The Fiber adapters are separate nested modules (to keep Fiber/fasthttp
  # out of the core go.mod), so `go test ./...` at the root does not cover
  # them — test each on its own.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [jsonrpcfiber, jsonrpcfiberv3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

      - name: govulncheck ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        # pinned for reproducibility; bump deliberately. v1.1.4 (built with
        # Go 1.23) cannot load a go1.26 module — keep the pin at or above the
        # module floor's Go release.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Go 1.27 made the json/v2-backed encoding/json the default, so the old
  # GOEXPERIMENT=jsonv2 job stopped testing anything the plain matrix does
  # not already cover. The mode that now lacks coverage is the opt-out:
  # a consumer who hits a compatibility problem reaches for
  # GOEXPERIMENT=nojsonv2, and that build has to stay green and stay
  # behaviourally equivalent (this library guarantees semantic, not
  # byte-for-byte, output — see doc.go). Go documents the opt-out as
  # temporary; delete this job once the toolchain drops the flag.
  nojsonv2:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: nojsonv2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Test core with GOEXPERIMENT=nojsonv2
        run: go test -race ./...

      - name: Test adapters with GOEXPERIMENT=nojsonv2
        run: |
          for m in jsonrpcfiber jsonrpcfiberv3; do
            (cd "$m" && go test -race ./...)
          done

  # The comparison-benchmark suite is a nested module with competitor
  # dependencies; it is compile-coupled to the core via a replace directive,
  # so core refactors can break it. Build+vet only — no benchmark execution
  # on PRs (absolute numbers on shared runners are meaningless; the monthly
  # benchmarks workflow handles runs).
  benchmarks-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Build and vet benchmarks module
        working-directory: benchmarks
        run: |
          go build ./...
          go vet ./...

  # Lints every module, including the adapters (their lint step used to live
  # in the adapters job, whose 'stable' Go broke lint the moment Go 1.27 became
  # stable: the then-pinned golangci-lint v2.10.1 was built with Go 1.26 and
  # cannot type-check a 1.27 tree — it panicked inside the 1.27 stdlib itself,
  # not on our code. v2.13.0 shipped go1.27 support on the day Go 1.27 did, so
  # the lint job runs 'stable' again on a v2.15.0 binary (built with go1.27.0).
  # If golangci-lint ever lags a Go release again, this is the seam: pin
  # setup-go to the release the linter is built with, not 'stable'.
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', jsonrpcfiber, jsonrpcfiberv3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: govulncheck
        # pinned for reproducibility; bump deliberately. Same rule as the
        # adapters job: the pin has to track the module floor's Go release.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  bench:
    # Informational perf-regression check: compares PR benchmarks against the
    # base branch with benchstat. Shared runners are noisy — treat deltas
    # under ~10% as noise; the job never blocks a merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Bench PR
        run: go test -run xxx -bench=. -benchmem -count=6 . | tee /tmp/new.txt

      - name: Bench base
        run: |
          git worktree add /tmp/base origin/${{ github.base_ref }}
          cd /tmp/base
          go test -run xxx -bench=. -benchmem -count=6 . | tee /tmp/old.txt || true

      - name: benchstat
        # pinned for reproducibility; bump deliberately
        run: go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d /tmp/old.txt /tmp/new.txt
